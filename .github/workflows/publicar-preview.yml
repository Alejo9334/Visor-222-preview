name: Publicar vista previa AR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener prototipo y sus imágenes desde Visor-222
        uses: actions/checkout@v4
        with:
          repository: Alejo9334/Visor-222
          ref: desarrollo/multicuadros-ar-v2
          sparse-checkout: |
            public/prototipo-ar
          sparse-checkout-cone-mode: true
          path: origen

      - name: Preparar sitio independiente
        run: |
          mkdir -p publicacion
          cp -R origen/public/prototipo-ar/. publicacion/
          test -f publicacion/index.html
          test -f publicacion/catalogo.json
          test -f publicacion/cuadro-original.png.png
          for n in 1 2 3 4 5; do test -f "publicacion/capa-$n.png.png"; done
          echo 'Vista previa y seis imágenes preparadas'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de la vista previa
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la vista previa
        id: deployment
        uses: actions/deploy-pages@v4
