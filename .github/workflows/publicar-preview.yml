name: Publicar vista previa AR

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Detectar repositorio de código fuente
        id: source
        shell: bash
        run: |
          if git ls-remote --exit-code https://github.com/Alejo9334/Code-fuente.git HEAD >/dev/null 2>&1; then
            echo "repository=Alejo9334/Code-fuente" >> "$GITHUB_OUTPUT"
          else
            echo "repository=Alejo9334/Visor-222" >> "$GITHUB_OUTPUT"
          fi

      - name: Obtener prototipo y sus imágenes desde código fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: desarrollo/multicuadros-ar-v2
          sparse-checkout: |
            public/prototipo-ar
          sparse-checkout-cone-mode: true
          path: origen

      - name: Preparar sitio independiente
        run: |
          mkdir -p publicacion
          cp -R origen/public/prototipo-ar/. publicacion/
          test -f publicacion/index.html
          test -f publicacion/catalogo.json
          test -f publicacion/cuadro-original.png.png
          for n in 1 2 3 4 5; do test -f "publicacion/capa-$n.png.png"; done
          echo 'Vista previa y seis imágenes preparadas'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de la vista previa
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la vista previa
        id: deployment
        uses: actions/deploy-pages@v4
